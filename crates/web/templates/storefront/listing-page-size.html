<div class="catalog-page-size">
    <label for="catalog-page-size">{{ crate::i18n::text("store-per-page") }}</label>
    <select class="ui-control" id="catalog-page-size" name="per_page" form="store-filters-form">{% for size in list.page_sizes %}<option value="{{ size }}"{% if list.per_page == *size %} selected{% endif %}>{{ size }}</option>{% endfor %}</select>
    <button class="ui-button" type="submit" form="store-filters-form" data-catalog-page-apply>{{ crate::i18n::text("store-apply") }}</button>
  </div>
