{% if entry.has_variants %}<form class="store-variant-selector" method="get" action="{{ crate::store_language::product_path(entry.slug) }}" hx-get="{{ crate::store_language::product_path(entry.slug) }}" hx-trigger="change, submit" hx-target="#product-detail" hx-select="#product-detail" hx-swap="outerHTML" hx-push-url="true" aria-label="{{ crate::i18n::text("store-choose-variant") }}">{% for axis in axes %}<label for="store-{{ axis.field }}">{{ axis.name }}</label><select class="ui-control" id="store-{{ axis.field }}" name="{{ axis.field }}"><option value="">{{ crate::i18n::text("store-choose") }} {{ axis.name }}</option>{% for choice in axis.choices %}<option value="{{ choice.id }}"{% if choice.selected %} selected{% endif %}>{{ choice.name }}</option>{% endfor %}</select>{% endfor %}<noscript><button class="ui-button ui-button--small ui-button--secondary" type="submit">{{ crate::i18n::text("store-show-variant") }}</button></noscript></form>{% endif %}
