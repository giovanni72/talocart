<form class="store-cart-add" method="post" action="{{ crate::store_language::path("/cart/add") }}">
<input type="hidden" name="csrf" value="{{ crate::store_presentation::cart_csrf() }}"><input type="hidden" name="revision" value="{{ crate::store_presentation::cart_revision() }}"><input type="hidden" name="product_id" value="{{ entry.id }}"><input type="hidden" name="variant_id" value="{{ variant_id }}">
<label for="cart-quantity">{{ crate::i18n::text("store-cart-quantity") }}</label>
<div class="store-cart-add-controls"><input class="ui-control" id="cart-quantity" name="quantity" type="number" min="{{ entry.packs }}" step="{{ entry.packs }}" max="{% if entry.manage_stock %}{{ entry.stock }}{% else %}999999{% endif %}" value="{{ quantity }}"{% if quantity_pricing %} hx-post="{{ price_action }}" hx-trigger="input delay:350ms, price-retry" hx-request='{"timeout":10000}' hx-include="closest form" hx-target="#product-unit-price" hx-select="#product-unit-price" hx-select-oob="#product-unit-net,#product-unit-tax" hx-swap="outerHTML" hx-sync="this:replace"{% endif %} required aria-describedby="product-purchase-rules cart-stock-note"><button class="ui-button" type="submit">{{ ui::icon("shopping-cart", "normal") }}<span>{{ crate::i18n::text("store-cart-add") }}</span></button></div>
{% if quantity_pricing %}<noscript><button class="ui-button ui-button--compact ui-button--secondary" type="submit" formaction="{{ price_action }}">{{ crate::i18n::text("store-update-price") }}</button></noscript>{% endif %}
{% if quantity_pricing %}<p class="ui-message ui-message--error" id="product-price-error" role="alert" hidden>{{ crate::i18n::text("store-price-error") }}</p><button class="ui-button ui-button--compact ui-button--secondary" type="button" data-price-retry hidden>{{ crate::i18n::text("store-update-price") }}</button>{% endif %}
<p id="cart-stock-note" class="ui-help">{{ crate::i18n::text("store-cart-no-reservation") }}</p></form>
