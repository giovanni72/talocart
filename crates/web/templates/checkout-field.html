<div class="field-stack" data-field-policy data-private-mode="{{ field.private_mode }}" data-business-mode="{{ field.business_mode }}"{% if field.hidden %} hidden{% endif %}><label for="{{ field.name }}">{{ field.label }} <span data-required-mark aria-hidden="true"{% if !field.required %} hidden{% endif %}>*</span></label>
{% if field.kind == "country" %}<select class="ui-control" id="{{ field.name }}" name="{{ field.name }}"{% if field.hidden %} disabled{% endif %}{% if field.required %} required{% endif %} autocomplete="{{ field.autocomplete }}"{% if field.error %} aria-invalid="true" aria-describedby="err-{{ field.name }}"{% endif %}><option value="">{{ crate::i18n::text("co-select-country") }}</option>{% for country in field.countries %}<option value="{{ country.code }}"{% if field.value == country.code %} selected{% endif %}>{{ country.label }}</option>{% endfor %}</select>
{% else if field.kind == "textarea" %}<textarea class="ui-control" id="{{ field.name }}" name="{{ field.name }}"{% if field.hidden %} disabled{% endif %}{% if field.required %} required{% endif %} maxlength="{{ field.max }}" rows="3"{% if field.error %} aria-invalid="true" aria-describedby="err-{{ field.name }}"{% endif %}>{{ field.value }}</textarea>
{% else %}<input class="ui-control" id="{{ field.name }}" name="{{ field.name }}"{% if field.hidden %} disabled{% endif %}{% if field.required %} required{% endif %} type="{{ field.kind }}" value="{{ field.value }}" maxlength="{{ field.max }}" autocomplete="{{ field.autocomplete }}"{% if field.error %} aria-invalid="true" aria-describedby="err-{{ field.name }}"{% endif %}>{% endif %}
{% if field.error %}<small class="ui-field-error" id="err-{{ field.name }}">{{ crate::i18n::text("co-field-error") }}</small>{% endif %}</div>
