events {}
http {
    access_log off;
    server {
        listen 8080;
        client_max_body_size 32m;
        location / {
            proxy_pass http://127.0.0.1:3300;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For $remote_addr;
        }
    }
}
