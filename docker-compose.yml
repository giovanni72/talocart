# Local, disposable demo of the standalone base. Not a production deployment.
name: talocart-demo
x-app: &app
  image: talocart-base-demo:local
  build:
    context: .
    dockerfile: docker/demo/Dockerfile
  environment:
    TALOCART_DATABASE_URL: postgres://talocart_demo:local-demo-only@postgres:5432/talocart_demo
  volumes:
    - app-data:/data
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: talocart_demo
      POSTGRES_PASSWORD: local-demo-only
      POSTGRES_DB: talocart_demo
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U talocart_demo -d talocart_demo"]
      interval: 2s
      timeout: 3s
      retries: 30
  migrate:
    <<: *app
    command: ["migrate"]
    depends_on:
      postgres:
        condition: service_healthy
  app:
    <<: *app
    command: ["serve"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:3300:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:3300/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 30
    stop_grace_period: 30s
  proxy:
    image: nginx:stable-alpine
    network_mode: service:app
    depends_on:
      app:
        condition: service_healthy
    volumes:
      - ./docker/demo/nginx.conf:/etc/nginx/nginx.conf:ro
volumes:
  postgres-data:
  app-data:
