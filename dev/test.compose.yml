# Dedicated test services; never attach application storage or database volumes.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: talocart_test
      POSTGRES_PASSWORD: ${TALOCART_TEST_SERVICE_PASSWORD:?Use scripts/test-env.py}
      POSTGRES_DB: talocart_test
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U talocart_test -d talocart_test"]
      interval: 2s
      timeout: 3s
      retries: 30
  mailpit:
    image: axllent/mailpit:v1.31.6@sha256:23fe39e81bde596a918000b3135c0f85dc8bb4c9ea6be274b051143f3e300387
    ports:
      - "127.0.0.1:11025:1025"
      - "127.0.0.1:18025:8025"
    environment:
      MP_DISABLE_VERSION_CHECK: 'true'
      MP_SMTP_DISABLE_RDNS: 'true'
volumes:
  postgres:
