# Replace shop.example.com and certificate paths. Load in nginx's http context.
# The proxy owns per-client authentication limits; the app retains account/session
# limits. Empty keys leave storefront, assets and health probes outside this zone.
map $uri $talocart_auth_client {
    default "";
    ~^/(?:it/|en/)?account/(?:login|register|reset|confirm|confirmation)$ $binary_remote_addr;
}
limit_req_zone $talocart_auth_client zone=talocart_auth:10m rate=12r/m;
server {
    listen 80;
    server_name shop.example.com;
    return 308 https://shop.example.com$request_uri;
}
server {
    listen 443 ssl;
    server_name shop.example.com;
    ssl_certificate /etc/letsencrypt/live/shop.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/shop.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 12m;
    limit_req zone=talocart_auth burst=20 nodelay;
    limit_req_status 429;
    # Add the operator's real IP here before first setup. Default: deny everyone.
    # allow 192.0.2.10;
    deny all;
    # Remove allow/deny only after the owner exists and setup is closed.
    location = /admin/modules/preview {
        # 128 MiB payload + signed manifest and multipart envelope.
        client_max_body_size 129m;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header X-Talocart-Update-Probe "";
        proxy_set_header Host shop.example.com;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Forwarded-For "";
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header X-Talocart-Update-Probe "";
        proxy_set_header Host shop.example.com;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Forwarded-For "";
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
